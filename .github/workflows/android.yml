name: Android Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Cache Cargo artifacts
      uses: Swatinem/rust-cache@v2

    - name: Accept Android SDK licenses
      run: |
        SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
        set +o pipefail
        yes | "$SDKMANAGER" --licenses > /dev/null

    - name: Install Android NDK
      run: |
        SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
        "$SDKMANAGER" --install "ndk;28.0.12433566"
        echo "ANDROID_NDK_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/28.0.12433566" >> $GITHUB_ENV

    - name: Download Model Assets
      run: |
        echo "Creating assets directory..."
        mkdir -p assets/parakeet-tdt-0.6b-v3-int8
        cd assets/parakeet-tdt-0.6b-v3-int8

        download() {
          echo "Downloading $1..."
          if ! wget -q "https://huggingface.co/nvidia/parakeet-tdt-0.6b/resolve/main/parakeet-tdt-0.6b-v3-int8/$1"; then
            rm -f "$1"
            echo "::warning::Could not download $1: nvidia/parakeet-tdt-0.6b currently requires Hugging Face authentication. Building without bundled model files; the app downloads them on device at first run."
          fi
        }

        download encoder-model.int8.onnx
        download nemo128.onnx
        download vocab.txt

        echo "Assets directory:"
        ls -la

    - name: Build APK
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceAI-APK
        path: android_transcribe_app_release.apk
