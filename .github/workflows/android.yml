name: Android Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Cache Cargo registry
      uses: Swatinem/rust-cache@v2
      with:
        # A restored target/ dir left whisper-rs-sys with a stale CMake tree
        # and broke the build; cache only the registry and build target/ fresh.
        cache-targets: false

    - name: Accept Android SDK licenses
      run: |
        SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
        set +o pipefail
        yes | "$SDKMANAGER" --licenses > /dev/null

    - name: Install Android NDK
      run: |
        SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
        "$SDKMANAGER" --install "ndk;28.0.12433566"
        echo "ANDROID_NDK_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/28.0.12433566" >> $GITHUB_ENV

    - name: Download Model Assets
      run: |
        # Parakeet TDT 0.6B v3 (int8 ONNX export), public and ungated on Hugging Face.
        # If a download fails, the APK is still built but without the bundled speech model.
        MODEL_DIR=assets/parakeet-tdt-0.6b-v3-int8
        BASE_URL=https://huggingface.co/istupakov/parakeet-tdt-0.6b-v3-onnx/resolve/main
        mkdir -p "$MODEL_DIR"
        for f in encoder-model.int8.onnx decoder_joint-model.int8.onnx nemo128.onnx vocab.txt; do
          echo "Downloading $f..."
          if ! curl -fsSL --retry 3 -o "$MODEL_DIR/$f" "$BASE_URL/$f"; then
            rm -f "$MODEL_DIR/$f"
            echo "::warning::Could not download $f. The APK will not include the bundled speech model."
          fi
        done
        ls -la "$MODEL_DIR"

    - name: Build APK
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceAI-APK
        path: android_transcribe_app_release.apk
